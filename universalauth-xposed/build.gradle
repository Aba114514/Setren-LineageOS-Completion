plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace "ax.nd.universalauth.xposed"
    compileSdk 36
    buildToolsVersion "35.0.0"

    defaultConfig {
        applicationId "ax.nd.universalauth.xposed"
        minSdk 29
        targetSdk 32

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    lint {
        checkReleaseBuilds false
    }
}

dependencies {
    implementation project(":libuniversalauth-xposed")
    // xposedutil 1.1 sources are vendored under src/main/java because the
    // original package registry is no longer reliably reachable.
    compileOnly "de.robv.android.xposed:api:82"

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
}
